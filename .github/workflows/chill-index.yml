name: Chill Index

# Pipeline autónomo del Chill Index de CICOMA.
#
# Corre en GitHub, no en la computadora del establecimiento: la publicación del
# pronóstico ya no depende de que haya alguien con la máquina encendida.
#
# Horarios: seis controles diarios, decididos con la auditoría sombra
# (AUDITORIA_CHILL_SHADOW, 2026-07-30 → 2026-08-03) y con el episodio del
# 2026-08-06. Uruguay está en UTC-3 todo el año (no aplica horario de verano).
#
#   07:17 local = 10:17 UTC   ┐ dos controles tempranos: el Last-Modified de los
#   11:17 local = 14:17 UTC   ┘ mapas se observó a las 06:00–07:00 local
#   13:17 local = 16:17 UTC   ┐
#   14:47 local = 17:47 UTC   │ cuatro controles próximos en la ventana donde se
#   16:17 local = 19:17 UTC   │ observaron republicaciones bajo la misma URL
#   18:47 local = 21:47 UTC   ┘ (sellos de 14:00 local el 27/07 y el 29/07)
#
# Por qué NO el esquema anterior (13:00 / 14:30 / 16:00 / 18:00 local): suponía
# que la corrida aparece ≈13:06 local, dato que viene del sello INTERNO de dos
# mapas. El Last-Modified HTTP —que es lo que decide la vigencia— se observó a
# las 06:00–07:00 local en 5 de 7 días. El esquema viejo no miraba nunca esa
# franja y concentraba las cuatro oportunidades en cinco horas de la tarde: el
# 2026-08-06 los runners de GitHub fallaron dos veces seguidas y el pronóstico
# quedó congelado más de 24 h.
#
# Por qué NO "cada 6 horas": gastaría tres de cuatro intentos en la madrugada,
# cuando ningún sello observado cae en esa franja.
#
# Los minutos son deliberadamente 17 y 47: el comienzo exacto de hora es cuando
# más carga tiene la cola de GitHub Actions.
#
# El cron de GitHub Actions es "best effort" y puede demorarse varios minutos:
# estos horarios NO son una garantía al minuto. Ese atraso NO altera la
# vigencia: la antigüedad se mide contra el Last-Modified de la fuente, nunca
# contra la hora de ejecución.

on:
  workflow_dispatch:
    inputs:
      motivo:
        description: "Motivo de la ejecución manual"
        required: false
        default: "manual"
  schedule:
    - cron: "17 10 * * *" # 07:17 local
    - cron: "17 14 * * *" # 11:17 local
    - cron: "17 16 * * *" # 13:17 local
    - cron: "47 17 * * *" # 14:47 local
    - cron: "17 19 * * *" # 16:17 local
    - cron: "47 21 * * *" # 18:47 local

# Una sola corrida por vez: dos ejecuciones simultáneas podrían pisarse al
# commitear. No se cancela la que ya está corriendo.
concurrency:
  group: chill-index
  cancel-in-progress: false

# Permisos mínimos: sólo escribir en el propio repositorio.
permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/chill_index/requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/chill_index/requirements.txt
          pip install pytest

      - name: Pruebas del pipeline (no dependen de INIA)
        run: python -m pytest tools/chill_index/tests -q

      - name: Ejecutar el pipeline contra INIA-GRAS
        id: pipeline
        run: |
          python -m tools.chill_index.cli \
            --output data/chill_index.json \
            --evidence evidence \
            --history data/chill_history.jsonl \
            --batches data/mini_batches.jsonl \
            --trigger "${{ github.event_name }}" \
            --workflow-run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            | tee pipeline.log

      - name: Verificar el contrato publicado
        run: |
          python - <<'PY'
          import json, sys
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          sys.path.insert(0, ".")
          from tools.chill_index import contract, settings

          payload = json.loads(Path("data/chill_index.json").read_text(encoding="utf-8"))
          # El día de hoy va como argumento: sin él, la invariante de ACTUALIZADO
          # no puede evaluarse y un contrato correcto se rechazaría.
          hoy = datetime.now(ZoneInfo(settings.TIMEZONE)).date().isoformat()
          contract.validate(payload, today_iso=hoy)
          print(f"Contrato válido. Estado: {payload['status']}")
          for mapa in payload["maps"]:
              estado = mapa["availability_status"]
              if estado == "DISPONIBLE":
                  etiqueta = mapa["risk_category"]
              elif estado == "ERROR":
                  etiqueta = f"ERROR ({mapa['reason_code']})"
              else:
                  etiqueta = f"SIN DATOS ({mapa['reason_code']})"
              print(f"  {mapa['valid_date']}  {etiqueta}")
          PY

      - name: Resumen de la ejecución
        if: always()
        run: python tools/chill_index/summary.py >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar si cambió el contenido
        id: commit
        run: |
          set -euo pipefail
          ESTADO=$(python -c "import json;print(json.load(open('data/chill_index.json'))['status'])")
          git config user.name "cicoma-chill-bot"
          git config user.email "cicoma-chill-bot@users.noreply.github.com"
          # `mini_batches.jsonl` es la MEMORIA de identidad de los juegos de
          # miniaturas. Sin versionarlo, cada corrida arrancaría sin saber qué
          # lotes conoce y volvería a fechar por Last-Modified un juego viejo
          # que INIA re-sirve: justo el error que la arquitectura cierra.
          git add data/chill_index.json data/chill_history.jsonl \
                  data/mini_batches.jsonl evidence
          if git diff --cached --quiet; then
            echo "Sin cambios: no se crea un commit vacío."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Chill Index $(date -u +'%Y-%m-%dT%H:%M:%SZ') [$ESTADO]"
          # El publicador local del tablero empuja al mismo repositorio: se
          # reintenta con rebase para que ninguno de los dos pierda su commit.
          for intento in 1 2 3; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              echo "committed=true" >> "$GITHUB_OUTPUT"
              git rev-parse HEAD | sed 's/^/sha=/' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Reintento $intento del push"
            sleep 5
          done
          echo "No se pudo publicar el commit tras tres intentos" >&2
          exit 1

      - name: Artefactos de diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chill-index-diagnostico-${{ github.run_id }}
          path: |
            data/chill_index.json
            data/chill_history.jsonl
            pipeline.log
            evidence/
          retention-days: 30
          if-no-files-found: warn
